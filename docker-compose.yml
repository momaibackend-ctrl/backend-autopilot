services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autopilot
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot
    ports:
      - "54329:5432"
    volumes:
      - autopilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  autopilot_postgres:
