name: Backend Autopilot epic verification

# Produces the evidence the epic gate judges, from ONE immutable checkout.
#
# The commit is an explicit input, never a branch: half a run against one `main` and half against a
# `main` that moved would describe a state that never existed, which is the exact failure the epic
# gate exists to end.
#
# The services below are real and disposable. An integration dimension whose tests skipped because
# no database was reachable is recorded as unverified, not as a pass -- so these have to actually be
# up, and the runner records which attributed tests genuinely ran.

on:
  workflow_dispatch:
    inputs:
      epic_key:
        description: Epic identifier, used for the concurrency group and the run title
        required: true
        type: string
      head_sha:
        description: The exact commit the epic is verified at
        required: true
        type: string
      epic_input:
        description: JSON with projectId, epicKey, headSha, resourceId, member selection and the project's serviceEnv mapping
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialized per epic and commit: two runs writing evidence for the same epic would interleave
  # verdicts. Built from the two short inputs rather than the payload -- a concurrency group is
  # capped at 255 characters, and the JSON payload silently exceeded it, which failed the workflow
  # before any job was created and left nothing in the logs to read.
  group: autopilot-epic-${{ inputs.epic_key }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: ${{ inputs.epic_key }} @ ${{ inputs.head_sha }}
    env:
      AUTOPILOT_EPIC_INPUT: ${{ inputs.epic_input }}
      DATABASE_URL: ${{ secrets.AUTOPILOT_CONTROL_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.AUTOPILOT_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AUTOPILOT_SUPABASE_SERVICE_ROLE_KEY }}
      AUTOPILOT_GITHUB_TOKEN: ${{ secrets.AUTOPILOT_GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.AUTOPILOT_GITHUB_TOKEN }}
      AUTOPILOT_EPIC_POSTGRES_URL: postgresql://autopilot:autopilot@127.0.0.1:5432/autopilot_epic
      AUTOPILOT_EPIC_REDIS_URL: redis://127.0.0.1:6379
      AUTOPILOT_EPIC_S3_ENDPOINT: http://127.0.0.1:9000
      AUTOPILOT_EPIC_S3_ACCESS_KEY: autopilotepic
      AUTOPILOT_EPIC_S3_SECRET_KEY: autopilotepicsecret
      AUTOPILOT_EPIC_S3_BUCKET: autopilot-epic
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autopilot
          POSTGRES_PASSWORD: autopilot
          POSTGRES_DB: autopilot_epic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autopilot -d autopilot_epic"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      # Started as a step rather than a service container: a service cannot override the image
      # command, and the official MinIO image needs `server /data`. The auto-starting bitnami image
      # avoided that, but it no longer publishes a `latest` tag, so the pull failed before any step
      # ran at all.
      - name: Start the disposable object store
        run: |
          docker run -d --name autopilot-epic-minio             -p 9000:9000             -e MINIO_ROOT_USER="$AUTOPILOT_EPIC_S3_ACCESS_KEY"             -e MINIO_ROOT_PASSWORD="$AUTOPILOT_EPIC_S3_SECRET_KEY"             minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - name: Wait for the disposable object store and create its bucket
        run: |
          ready=""
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              ready="yes"
              echo "object storage ready after ${attempt} attempt(s)"
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            # Not fatal on its own: the runner records an unreachable dependency as an unverified
            # dimension rather than pretending the epic passed without it.
            echo "::warning::object storage did not report healthy; storage-backed tests will be recorded as unverified"
            exit 0
          fi
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c             "mc alias set epic http://127.0.0.1:9000 $AUTOPILOT_EPIC_S3_ACCESS_KEY $AUTOPILOT_EPIC_S3_SECRET_KEY && mc mb -p epic/$AUTOPILOT_EPIC_S3_BUCKET"             || echo "::warning::bucket creation failed; storage-backed tests will be recorded as unverified"
      - name: Verify the epic at its exact commit
        run: pnpm epic:verify
