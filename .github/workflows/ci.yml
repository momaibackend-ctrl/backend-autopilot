name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autopilot
          POSTGRES_USER: autopilot
          POSTGRES_PASSWORD: autopilot
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U autopilot -d autopilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://autopilot:autopilot@127.0.0.1:54329/autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      # tsconfig excludes supabase/**, so nothing else type-checks the edge functions: they are
      # only ever exercised at `supabase functions deploy`, where a bad import fails the deploy
      # itself. This catches both classes locally -- unresolvable `.js` -> `.ts` import-map gaps
      # and genuine type errors that tsc never sees.
      - run: pnpm typecheck:edge
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm test:browser
