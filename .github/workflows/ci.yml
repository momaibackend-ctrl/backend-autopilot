name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: autopilot
          POSTGRES_USER: autopilot
          POSTGRES_PASSWORD: autopilot
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U autopilot -d autopilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://autopilot:autopilot@127.0.0.1:54329/autopilot
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm test:browser
  portable-container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build provider-neutral runtime image
        run: docker build --file docker/Dockerfile --tag backend-autopilot:${GITHUB_SHA} .
      - name: Validate Kamal 2.12 configuration
        run: >-
          docker run --rm
          --volume "${PWD}:/workdir"
          --workdir /workdir
          --env AUTOPILOT_SERVER_IP=192.0.2.10
          --env AUTOPILOT_PUBLIC_HOST=backend.example.com
          --env AUTOPILOT_UPSTREAM_MCP_URL=https://upstream.example.com/mcp
          --env AUTOPILOT_UPSTREAM_CONTROL_API_URL=https://upstream.example.com/control-api
          --env AUTOPILOT_OAUTH_AUTHORIZATION_SERVER_URL=https://upstream.example.com/auth/v1
          --env KAMAL_REGISTRY_USERNAME=ci
          --env KAMAL_REGISTRY_PASSWORD=not-a-secret
          ghcr.io/basecamp/kamal:v2.12.0 config > /dev/null
