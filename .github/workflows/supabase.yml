name: Deploy Supabase control plane
on:
  push:
    branches: [autopilot/v0.5-superadmin-mcp, main]
    # packages/** is included because the edge functions bundle straight from these packages
    # (see supabase/functions/_shared/edge-dependencies.ts) -- a fix landing anywhere in
    # packages/core, packages/superadmin, etc. previously needed a manual workflow_dispatch to
    # ever reach the deployed function, which is how the CORE-BE-07/09/10 apiCompatibility fix
    # sat undeployed until someone noticed. Redeploying on every packages/** push is safe: the
    # job is idempotent and health-checked with an automatic rollback to mcp-last-good.
    paths: ["supabase/**", "packages/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.AUTOPILOT_CONTROL_DATABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.AUTOPILOT_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: qtyfdzjzmgxtrarpgcmn
      AUTOPILOT_GITHUB_DISPATCH_TOKEN: ${{ secrets.AUTOPILOT_GITHUB_TOKEN }}
      AUTOPILOT_MCP_TOKEN: ${{ secrets.AUTOPILOT_MCP_TOKEN }}
      AUTOPILOT_SUPERADMIN_MCP_TOKEN: ${{ secrets.AUTOPILOT_SUPERADMIN_MCP_TOKEN }}
      AUTOPILOT_RECONCILE_TOKEN: ${{ secrets.AUTOPILOT_RECONCILE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.75.0 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Configure Edge server secrets
        run: >-
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID"
          AUTOPILOT_GITHUB_DISPATCH_TOKEN="$AUTOPILOT_GITHUB_DISPATCH_TOKEN"
          AUTOPILOT_CONTROL_REPOSITORY="momaibackend-ctrl/backend-autopilot"
          AUTOPILOT_CONTROL_REF="main"
          AUTOPILOT_SYSTEM_PROJECT_ID="ac6d68be-272c-4bca-aab1-cd1a442cf960"
          AUTOPILOT_OPERATOR_EMAILS="momaibackend@gmail.com"
          AUTOPILOT_SUPERADMIN_EMAILS="momaibackend@gmail.com"
          AUTOPILOT_OPERATOR_PROJECT_IDS="ac6d68be-272c-4bca-aab1-cd1a442cf960"
          AUTOPILOT_MCP_PROJECT_IDS="ac6d68be-272c-4bca-aab1-cd1a442cf960"
          AUTOPILOT_CONSOLE_ORIGINS="https://momaibackend-ctrl.github.io"
          AUTOPILOT_MCP_TOKEN="$AUTOPILOT_MCP_TOKEN"
          AUTOPILOT_SUPERADMIN_MCP_TOKEN="$AUTOPILOT_SUPERADMIN_MCP_TOKEN"
          AUTOPILOT_SUPERADMIN_MCP_ACTOR="momaibackend-ctrl-superadmin"
          AUTOPILOT_RECONCILE_TOKEN="$AUTOPILOT_RECONCILE_TOKEN"
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
      - name: Health-check the new deployment (tools/list + system_health)
        id: health
        run: pnpm mcp:health-check
      - name: Roll back the Edge Function to the last known-good deployment
        if: failure() && steps.health.outcome == 'failure'
        run: |
          if ! git fetch origin refs/tags/mcp-last-good:refs/tags/mcp-last-good; then
            echo "::error::Health check failed and no prior known-good deployment tag exists to roll back to. The live Superadmin MCP may be degraded; human intervention is required." >&2
            exit 1
          fi
          git checkout mcp-last-good -- supabase
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
          pnpm mcp:health-check
          echo "::error::Deployed commit failed its health check; rolled back the live Superadmin MCP to the last known-good version (tag mcp-last-good)." >&2
          exit 1
      - name: Record this deployment as the new known-good rollback point
        if: success()
        run: |
          git tag -f mcp-last-good "$GITHUB_SHA"
          git push origin refs/tags/mcp-last-good --force
